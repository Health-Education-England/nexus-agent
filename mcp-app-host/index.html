<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MCP App Host</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f4ef;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-strong: #ffffff;
        --border: rgba(15, 23, 42, 0.08);
        --border-strong: rgba(15, 23, 42, 0.16);
        --text: #172033;
        --muted: #5b6475;
        --accent: #14532d;
        --accent-strong: #0f3d22;
        --accent-foreground: #ffffff;
        --accent-soft: rgba(20, 83, 45, 0.1);
        --danger: #b42318;
        --danger-soft: rgba(180, 35, 24, 0.08);
        --shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        --user-bubble: linear-gradient(135deg, #14532d, #1f7a42);
        --assistant-bubble: rgba(255, 255, 255, 0.94);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10151f;
          --panel: rgba(17, 24, 39, 0.92);
          --panel-strong: #111827;
          --border: rgba(148, 163, 184, 0.12);
          --border-strong: rgba(148, 163, 184, 0.2);
          --text: #e5edf8;
          --muted: #9ba7ba;
          --accent: #1f7a42;
          --accent-strong: #166534;
          --accent-foreground: #f3fff7;
          --accent-soft: rgba(125, 211, 167, 0.12);
          --danger: #fda29b;
          --danger-soft: rgba(253, 162, 155, 0.14);
          --shadow: 0 24px 64px rgba(2, 6, 23, 0.45);
          --user-bubble: linear-gradient(135deg, #166534, #15803d);
          --assistant-bubble: rgba(17, 24, 39, 0.92);
        }
      }

      html,
      body {
        height: 100%;
        font-family: "Frutiger W01", Frutiger, Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(20, 83, 45, 0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.08), transparent 22%),
          var(--bg);
        color: var(--text);
      }

      body {
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      #app-shell {
        display: flex;
        height: 100%;
        width: 100%;
      }

      #sidebar {
        width: 320px;
        padding: 1.5rem 1rem 1rem;
        border-right: 1px solid var(--border);
        background: var(--panel);
        backdrop-filter: blur(24px);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        box-shadow: var(--shadow);
        z-index: 20;
      }

      .sidebar-header {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .sidebar-kicker {
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .sidebar-title {
        font-size: 1.55rem;
        line-height: 1.1;
        font-weight: 650;
      }

      .sidebar-subtitle {
        font-size: 0.92rem;
        color: var(--muted);
        line-height: 1.45;
      }

      #new-conversation-btn {
        border: none;
        border-radius: 14px;
        padding: 0.9rem 1rem;
        background: var(--accent);
        color: var(--accent-foreground);
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 12px 28px rgba(20, 83, 45, 0.22);
      }

      #new-conversation-btn:hover {
        background: var(--accent-strong);
      }

      .sidebar-section-label {
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 0.35rem;
      }

      #conversation-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        overflow-y: auto;
        padding-right: 0.2rem;
      }

      .conversation-item {
        display: flex;
        gap: 0.55rem;
        border: 1px solid transparent;
        border-radius: 18px;
        padding: 0.25rem;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .conversation-item:hover,
      .conversation-item.active {
        background: var(--panel-strong);
        border-color: var(--border);
        transform: translateY(-1px);
      }

      .conversation-select {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.7rem 0.8rem;
        border-radius: 14px;
        color: inherit;
      }

      .conversation-title {
        font-size: 0.98rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .conversation-meta {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .conversation-actions {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.45rem;
        padding-right: 0.35rem;
      }

      .conversation-action-btn,
      .conversation-inline-btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: 999px;
        padding: 0.38rem 0.72rem;
        font-size: 0.78rem;
      }

      .conversation-action-btn:hover,
      .conversation-inline-btn:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }

      .conversation-action-btn.danger {
        color: var(--danger);
      }

      .conversation-rename-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        padding: 0.7rem 0.8rem;
        border-radius: 14px;
        background: var(--panel-strong);
        border: 1px solid var(--border);
      }

      .conversation-rename-input {
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 0.7rem 0.8rem;
        background: transparent;
        color: inherit;
      }

      .conversation-rename-input:focus,
      #chat-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .conversation-rename-actions {
        display: flex;
        gap: 0.55rem;
      }

      .conversation-inline-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .conversation-empty {
        border: 1px dashed var(--border-strong);
        border-radius: 18px;
        padding: 1.2rem;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.22);
      }

      #sidebar-overlay {
        position: fixed;
        inset: 0;
        border: none;
        background: rgba(15, 23, 42, 0.38);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        z-index: 10;
      }

      #sidebar-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      #chat-panel {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 1rem;
        gap: 1rem;
      }

      .chat-shell {
        flex: 1;
        min-height: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(28px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        padding: 1rem 1.15rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }

      #menu-btn {
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 14px;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .chat-header-copy {
        min-width: 0;
      }

      #active-conversation-title {
        font-size: 1.12rem;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #active-conversation-meta {
        margin-top: 0.2rem;
        font-size: 0.84rem;
        color: var(--muted);
      }

      #messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      #messages > * {
        flex-shrink: 0;
      }

      .message {
        max-width: 85%;
        padding: 0.85rem 1rem;
        border-radius: 18px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: #fff;
        box-shadow: 0 14px 30px rgba(20, 83, 45, 0.2);
      }

      .message.assistant {
        align-self: flex-start;
        background: var(--assistant-bubble);
        border: 1px solid var(--border);
        white-space: normal;
      }

      /* Markdown-rendered content inside assistant messages */
      .message.assistant p { margin-bottom: 0.5rem; line-height: 1.6; }
      .message.assistant p:last-child { margin-bottom: 0; }
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3 { font-weight: 600; margin: 0.75rem 0 0.35rem; line-height: 1.3; }
      .message.assistant h1:first-child,
      .message.assistant h2:first-child,
      .message.assistant h3:first-child { margin-top: 0; }
      .message.assistant h1 { font-size: 1.1rem; }
      .message.assistant h2 { font-size: 1rem; }
      .message.assistant h3 { font-size: 0.95rem; }
      .message.assistant ul,
      .message.assistant ol { margin: 0.25rem 0 0.5rem 1.25rem; }
      .message.assistant li { margin-bottom: 0.25rem; line-height: 1.5; }
      .message.assistant strong { font-weight: 600; }
      .message.assistant em { font-style: italic; }
      .message.assistant code {
        background: rgba(148, 163, 184, 0.18);
        padding: 0.1em 0.3em;
        border-radius: 3px;
        font-family: monospace;
        font-size: 0.875em;
      }
      .message.assistant pre {
        background: rgba(148, 163, 184, 0.18);
        padding: 0.75rem;
        border-radius: 6px;
        overflow-x: auto;
        margin-bottom: 0.5rem;
      }
      .message.assistant pre code { background: none; padding: 0; }
      .message.assistant a {
        color: var(--accent);
        text-decoration: underline;
        word-break: break-all;
      }
      .message.assistant blockquote {
        border-left: 3px solid var(--border-strong);
        padding-left: 0.75rem;
        margin: 0.5rem 0;
        color: var(--muted);
      }

      .message.tool-call {
        align-self: flex-start;
        font-size: 0.85rem;
        background: rgba(59, 130, 246, 0.12);
        color: var(--text);
        border: 1px solid rgba(59, 130, 246, 0.18);
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
      }

      .message.tool-result {
        align-self: flex-start;
        font-size: 0.85rem;
        background: rgba(20, 83, 45, 0.1);
        color: var(--text);
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
      }

      .tool-status-row {
        align-self: flex-start;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .tool-status-row .message {
        margin: 0;
        max-width: none;
      }

      .skill-loading-chip {
        align-self: flex-start;
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        border: 1px dashed var(--border-strong);
        background: transparent;
        opacity: 0.85;
      }

      .response-synthesis-chip {
        align-self: flex-start;
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: transparent;
        opacity: 0.9;
      }

      .message.assistant:empty::after {
        content: "Thinking…";
        opacity: 0.5;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.2; }
      }

      .app-container {
        align-self: flex-start;
        width: 100%;
        flex: 0 0 auto;
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        background: var(--panel-strong);
      }

      .app-container iframe {
        width: 100%;
        min-height: 300px;
        border: none;
      }

      #input-area {
        padding: 1rem 1.15rem 1.15rem;
        border-top: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.08);
      }

      #input-area form {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
      }

      #input-area input {
        flex: 1;
        padding: 0.95rem 1rem;
        border: 1px solid var(--border-strong);
        border-radius: 16px;
        background: var(--panel-strong);
        color: inherit;
        font-size: 1rem;
      }

      #input-area button {
        padding: 0.95rem 1.35rem;
        border: none;
        border-radius: 16px;
        background: var(--accent);
        color: var(--accent-foreground);
        font-size: 1rem;
        font-weight: 600;
      }

      #input-area button:hover {
        background: var(--accent-strong);
      }

      #input-area button:disabled {
        background: rgba(148, 163, 184, 0.5);
        cursor: not-allowed;
      }

      #delete-dialog {
        width: min(92vw, 420px);
        margin: auto;
        border: none;
        background: transparent;
      }

      #delete-dialog::backdrop {
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(6px);
      }

      .dialog-card {
        background: var(--panel-strong);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 1.3rem;
        box-shadow: var(--shadow);
      }

      .dialog-title {
        font-size: 1.1rem;
        font-weight: 650;
      }

      .dialog-body {
        margin-top: 0.6rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .dialog-actions {
        margin-top: 1rem;
        display: flex;
        justify-content: flex-end;
        gap: 0.6rem;
      }

      .dialog-btn {
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        border-radius: 999px;
        padding: 0.7rem 1rem;
      }

      .dialog-btn.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }

      #toast {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        min-width: min(420px, calc(100vw - 2rem));
        max-width: calc(100vw - 2rem);
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel-strong);
        color: var(--text);
        box-shadow: var(--shadow);
        padding: 0.95rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        transform: translateY(24px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
        z-index: 40;
      }

      #toast.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .toast-actions {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }

      .toast-btn,
      .toast-close {
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        border-radius: 999px;
        padding: 0.5rem 0.8rem;
      }

      .toast-close {
        width: 2.2rem;
        height: 2.2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      @media (max-width: 959px) {
        #sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          transform: translateX(-104%);
          transition: transform 200ms ease;
          max-width: min(84vw, 340px);
        }

        #sidebar.open {
          transform: translateX(0);
        }

        #menu-btn {
          display: inline-flex;
        }

        #chat-panel {
          padding: 0.75rem;
        }

        .chat-shell {
          border-radius: 22px;
        }
      }

      @media (max-width: 640px) {
        #chat-panel {
          padding: 0.45rem;
        }

        .chat-header,
        #input-area {
          padding-left: 0.85rem;
          padding-right: 0.85rem;
        }

        #messages {
          padding: 0.9rem;
        }

        .message {
          max-width: 94%;
        }

        #toast {
          left: 1rem;
          right: 1rem;
          min-width: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <aside id="sidebar" aria-label="Saved conversations">
        <div class="sidebar-header">
          <div>
            <p class="sidebar-kicker">MCP App Host</p>
            <h1 class="sidebar-title">Conversations</h1>
            <p class="sidebar-subtitle">
              Reopen, rename, or delete saved threads without leaving the chat.
            </p>
          </div>
          <button id="new-conversation-btn" type="button">New conversation</button>
        </div>
        <p class="sidebar-section-label">Recent</p>
        <ul id="conversation-list" aria-label="Conversation history"></ul>
      </aside>

      <button id="sidebar-overlay" type="button" hidden aria-label="Close conversations"></button>

      <main id="chat-panel">
        <div class="chat-shell">
          <header class="chat-header">
            <button id="menu-btn" type="button" aria-label="Open conversations">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
            <div class="chat-header-copy">
              <h2 id="active-conversation-title">New conversation</h2>
              <p id="active-conversation-meta">Unsaved draft</p>
            </div>
          </header>

          <div id="messages"></div>

          <div id="input-area">
            <form id="chat-form">
              <input
                id="chat-input"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
              />
              <button type="submit">Send</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <dialog id="delete-dialog" aria-labelledby="delete-dialog-title">
      <div class="dialog-card">
        <h2 id="delete-dialog-title" class="dialog-title">Delete conversation?</h2>
        <p id="delete-dialog-text" class="dialog-body">
          This will permanently remove the selected conversation.
        </p>
        <div class="dialog-actions">
          <button id="delete-cancel-btn" class="dialog-btn" type="button">Cancel</button>
          <button id="delete-confirm-btn" class="dialog-btn danger" type="button">Delete</button>
        </div>
      </div>
    </dialog>

    <div id="toast" aria-live="polite" aria-atomic="true">
      <div id="toast-text"></div>
      <div class="toast-actions">
        <button id="toast-undo-btn" class="toast-btn" type="button" hidden>Undo</button>
        <button id="toast-close-btn" class="toast-close" type="button" aria-label="Dismiss notification">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
