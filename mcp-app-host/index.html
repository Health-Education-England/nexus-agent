<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MCP App Host</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: light-dark(#f9fafb, #111827);
        color: light-dark(#1f2937, #f3f4f6);
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 800px;
        margin: 0 auto;
      }

      header {
        padding: 1rem;
        border-bottom: 1px solid light-dark(#e5e7eb, #374151);
        text-align: center;
      }

      header h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #messages > * {
        flex-shrink: 0;
      }

      .message {
        max-width: 85%;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user {
        align-self: flex-end;
        background: #2563eb;
        color: #fff;
      }

      .message.assistant {
        align-self: flex-start;
        background: light-dark(#e5e7eb, #374151);
        white-space: normal;
      }

      /* Markdown-rendered content inside assistant messages */
      .message.assistant p { margin-bottom: 0.5rem; line-height: 1.6; }
      .message.assistant p:last-child { margin-bottom: 0; }
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3 { font-weight: 600; margin: 0.75rem 0 0.35rem; line-height: 1.3; }
      .message.assistant h1:first-child,
      .message.assistant h2:first-child,
      .message.assistant h3:first-child { margin-top: 0; }
      .message.assistant h1 { font-size: 1.1rem; }
      .message.assistant h2 { font-size: 1rem; }
      .message.assistant h3 { font-size: 0.95rem; }
      .message.assistant ul,
      .message.assistant ol { margin: 0.25rem 0 0.5rem 1.25rem; }
      .message.assistant li { margin-bottom: 0.25rem; line-height: 1.5; }
      .message.assistant strong { font-weight: 600; }
      .message.assistant em { font-style: italic; }
      .message.assistant code {
        background: light-dark(#d1d5db, #4b5563);
        padding: 0.1em 0.3em;
        border-radius: 3px;
        font-family: monospace;
        font-size: 0.875em;
      }
      .message.assistant pre {
        background: light-dark(#d1d5db, #4b5563);
        padding: 0.75rem;
        border-radius: 6px;
        overflow-x: auto;
        margin-bottom: 0.5rem;
      }
      .message.assistant pre code { background: none; padding: 0; }
      .message.assistant a {
        color: light-dark(#1d4ed8, #93c5fd);
        text-decoration: underline;
        word-break: break-all;
      }
      .message.assistant blockquote {
        border-left: 3px solid light-dark(#9ca3af, #6b7280);
        padding-left: 0.75rem;
        margin: 0.5rem 0;
        color: light-dark(#4b5563, #9ca3af);
      }

      .message.tool-call {
        align-self: flex-start;
        font-size: 0.85rem;
        background: light-dark(#e0e7ff, #1e1b4b);
        color: light-dark(#3730a3, #c7d2fe);
        border: 1px solid light-dark(#c7d2fe, #312e81);
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
      }

      .message.tool-result {
        align-self: flex-start;
        font-size: 0.85rem;
        background: light-dark(#dcfce7, #052e16);
        color: light-dark(#166534, #86efac);
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
      }

      .tool-status-row {
        align-self: flex-start;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .tool-status-row .message {
        margin: 0;
        max-width: none;
      }

      .skill-loading-chip {
        align-self: flex-start;
        font-size: 0.8rem;
        font-style: italic;
        color: light-dark(#6b7280, #9ca3af);
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        border: 1px dashed light-dark(#d1d5db, #4b5563);
        background: light-dark(#f9fafb, #1f2937);
        opacity: 0.85;
      }

      .response-synthesis-chip {
        align-self: flex-start;
        font-size: 0.8rem;
        font-style: italic;
        color: light-dark(#334155, #cbd5e1);
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        border: 1px solid light-dark(#cbd5e1, #475569);
        background: light-dark(#f8fafc, #0f172a);
        opacity: 0.9;
      }

      .message.assistant:empty::after {
        content: "Thinking…";
        opacity: 0.5;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.2; }
      }

      .app-container {
        align-self: flex-start;
        width: 100%;
        flex: 0 0 auto;
        border: 1px solid light-dark(#e5e7eb, #374151);
        border-radius: 12px;
        overflow: hidden;
      }

      .app-container iframe {
        width: 100%;
        min-height: 300px;
        border: none;
      }

      #input-area {
        padding: 1rem;
        border-top: 1px solid light-dark(#e5e7eb, #374151);
      }

      #input-area form {
        display: flex;
        gap: 0.5rem;
      }

      #input-area input {
        flex: 1;
        padding: 0.75rem 1rem;
        border: 1px solid light-dark(#d1d5db, #4b5563);
        border-radius: 8px;
        background: light-dark(#fff, #1f2937);
        color: inherit;
        font-size: 1rem;
        outline: none;
      }

      #input-area input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }

      #input-area button {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
      }

      #input-area button:hover {
        background: #1d4ed8;
      }

      #input-area button:disabled {
        background: light-dark(#9ca3af, #4b5563);
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>MCP App Host</h1>
      </header>
      <div id="messages"></div>
      <div id="input-area">
        <form id="chat-form">
          <input
            id="chat-input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
          />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
